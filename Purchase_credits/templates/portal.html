{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>学内情報ポータル</title>
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
</head>
<body>
  <div class="box">
    <h1>システムメンテナンス中</h1>
    <p>
      設備更新のため、一般向けの各種案内は現在停止しています。<br>
      復旧の見込みは学内掲示およびメールでお知らせします。
    </p>
    <hr>

    <p>関係者の方はサインインしてください。</p>
    <form method="post">
      {% csrf_token %}
      {% for error in form.non_field_errors %}
        <p class="error">{{ error }}</p>
      {% endfor %}
      <label>ユーザ名 {{ form.username }}</label>
      <label>パスワード {{ form.password }}</label>
      <button type="submit">サインイン</button>
    </form>

    <p class="small">お問い合わせ: 情報基盤センター（内線 2200）</p>
  </div>
</body>
</html>

{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}単位マーケット{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <a class="logo" href="{% url 'shop:subject_list' %}">単位マーケット</a>
    <a href="{% url 'shop:subject_list' %}">科目一覧</a>
    <a href="{% url 'shop:cart' %}">カート</a>
    <a href="{% url 'shop:order_list' %}">申込履歴</a>
    <a href="{% url 'dm:thread_list' %}">メッセージ</a>
    <span class="user">
      {{ user }} さん
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit">ログアウト</button>
      </form>
    </span>
  </header>

  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
